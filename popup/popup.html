<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 12px 16px;
      min-width: 220px;
      background: #0d1117;
      color: #e6edf3;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 14px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>GHUX</h1>
  <label>
    <input type="checkbox" id="wordWrap">
    Word wrap in diffs
  </label>
  <label>
    <input type="checkbox" id="splitView">
    Split view: draggable divider + synced scroll
  </label>
  <label>
    <input type="checkbox" id="diffMinimap">
    Diff minimap: change markers per file
  </label>
  <script src="popup.js"></script>
</body>
</html>
